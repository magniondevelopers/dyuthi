<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dyuthi Process Consultants — Website Wireframes</title>
<style>
  :root{
    --ink:#1c1c1c;
    --sub:#6b6b6b;
    --line:#b7b7b7;
    --line-soft:#d9d9d9;
    --block:#eeeeee;
    --block-strong:#e2e2e2;
    --accent:#2b4c7e;
    --accent-soft:#dde6f2;
    --page-bg:#fafafa;
    --canvas:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--page-bg);
    color:var(--ink);
  }

  /* ---------- Top chrome ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:var(--canvas);
    border-bottom:1px solid var(--line-soft);
    padding:14px 24px;
  }
  .topbar-inner{
    max-width:1200px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{
    font-size:14px; font-weight:600; letter-spacing:.02em;
  }
  .brand span{color:var(--sub); font-weight:400;}
  .nav-tabs{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .nav-tabs button{
    font-family:inherit;
    font-size:12.5px;
    padding:7px 12px;
    border-radius:6px;
    border:1px solid var(--line-soft);
    background:var(--canvas);
    color:var(--sub);
    cursor:pointer;
    white-space:nowrap;
  }
  .nav-tabs button:hover{ border-color:var(--accent); color:var(--accent); }
  .nav-tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .page-wrap{
    max-width:1200px;
    margin:28px auto 80px;
    padding:0 24px;
  }
  .page-meta{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .page-meta h1{
    font-size:20px; margin:0;
  }
  .page-meta .path{
    font-size:12.5px; color:var(--sub);
  }

  .canvas{
    background:var(--canvas);
    border:1px solid var(--line-soft);
    border-radius:4px;
    overflow:hidden;
  }

  /* ---------- Wireframe block primitives ---------- */
  .blk{
    border:1px dashed var(--line);
    background:var(--block);
    position:relative;
    padding:16px 18px;
  }
  .blk + .blk{ border-top:1px dashed var(--line); }
  .blk.strong{ background:var(--block-strong); }
  .blk.accent{ background:var(--accent-soft); border-style:solid; border-color:var(--accent); }
  .blk-label{
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent);
    font-weight:600;
    margin:0 0 4px;
  }
  .blk-desc{
    font-size:12.5px;
    color:#4a4a4a;
    margin:0;
    line-height:1.5;
  }
  .blk-title-mock{
    height:14px; width:46%; background:#cfcfcf; border-radius:2px; margin:2px 0 8px;
  }
  .blk-title-mock.sm{ height:10px; width:30%; }
  .blk-line-mock{
    height:8px; background:#dadada; border-radius:2px; margin:6px 0;
  }
  .blk-line-mock.w60{width:60%;} .blk-line-mock.w80{width:80%;} .blk-line-mock.w40{width:40%;}

  .row{ display:flex; }
  .row > .blk{ flex:1; border-left:1px dashed var(--line); }
  .row > .blk:first-child{ border-left:none; }

  .grid{
    display:grid;
    gap:0;
  }
  .grid.cols-2{ grid-template-columns:1fr 1fr; }
  .grid.cols-3{ grid-template-columns:1fr 1fr 1fr; }
  .grid.cols-4{ grid-template-columns:1fr 1fr 1fr 1fr; }
  .grid .blk{ border-left:1px dashed var(--line); border-top:1px dashed var(--line); }
  .grid .blk:nth-child(-n+3){ border-top:none; }
  .grid.cols-4 .blk:nth-child(-n+4){ border-top:none; }
  .grid.cols-2 .blk:nth-child(-n+2){ border-top:none; }
  .grid .blk:first-child, .grid.cols-2 .blk:nth-child(2n+1), .grid.cols-3 .blk:nth-child(3n+1), .grid.cols-4 .blk:nth-child(4n+1){ border-left:none; }

  .btn-mock{
    display:inline-block;
    font-size:11px; font-weight:600;
    padding:6px 14px;
    border:1px solid var(--accent);
    color:var(--accent);
    border-radius:3px;
    margin-top:8px;
  }
  .btn-mock.filled{ background:var(--accent); color:#fff; }

  .icon-mock{
    width:28px; height:28px; border-radius:50%;
    border:1px dashed var(--line);
    display:inline-block;
    margin-bottom:8px;
  }
  .avatar-mock{
    width:64px; height:64px; border-radius:50%;
    background:#d7d7d7; border:1px dashed var(--line);
  }
  .img-mock{
    background:repeating-linear-gradient(45deg, #e5e5e5, #e5e5e5 6px, #ececec 6px, #ececec 12px);
    border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:11px;
  }
  .logo-mock{
    width:64px; height:24px; background:#d7d7d7; border-radius:2px;
  }
  .pill{
    display:inline-block; font-size:10px; padding:3px 8px; border:1px solid var(--line);
    border-radius:20px; color:var(--sub); margin-right:6px;
  }
  .note{
    font-size:11.5px; color:var(--sub); font-style:italic; margin-top:4px;
  }

  /* page sections stack */
  .stack > .blk{ border-top:none; }
  .stack > .blk:first-child{ border-top:1px dashed var(--line); }

  .footer-mock{
    background:#333; color:#ccc; padding:20px 18px; font-size:11px;
  }

  .view{ display:none; }
  .view.active{ display:block; }

  @media (max-width:720px){
    .grid.cols-4{ grid-template-columns:1fr 1fr; }
    .grid.cols-3{ grid-template-columns:1fr 1fr; }
    .row{ flex-direction:column; }
    .row > .blk{ border-left:none; border-top:1px dashed var(--line); }
    .row > .blk:first-child{ border-top:none; }
  }
</style>
</head>

const navTabs = document.getElementById('navTabs');
const canvas = document.getElementById('canvas');
const pageTitle = document.getElementById('pageTitle');
const pagePath = document.getElementById('pagePath');

pages.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.textContent = p.label;
  btn.dataset.id = p.id;
  if (i === 0) btn.classList.add('active');
  btn.addEventListener('click', () => showPage(p.id));
  navTabs.appendChild(btn);
});

function showPage(id){
  const p = pages.find(pg => pg.id === id);
  if(!p) return;
  canvas.innerHTML = p.render();
  pageTitle.textContent = p.label;
  pagePath.textContent = 'dyuthiprocessconsultants.com' + p.path;
  document.querySelectorAll('.nav-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  window.scrollTo({top:0, behavior:'instant'});
}

showPage(pages[0].id);
</script>
